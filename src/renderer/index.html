<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <title>Floating Timer</title>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <div class="timer-container">
            <div class="window-controls">
                <button
                    id="compactBtn"
                    class="window-button"
                    title="Compact mode"
                >
                    ↙
                </button>
                <button
                    id="minimizeBtn"
                    class="window-button"
                    title="Minimize"
                >
                    -
                </button>
                <button
                    id="closeBtn"
                    class="window-button close-button"
                    title="Close"
                >
                    x
                </button>
            </div>
            <div id="timerMode" class="timer-mode">Stopwatch</div>
            <div class="timer-display" id="timer">
                00:00:00
            </div>
            <div class="duration-container">
                <div
                    id="durationControls"
                    class="duration-controls"
                >
                    <input 
                        id="durationInput"
                        type="text"
                        value="00:00:00"
                        placeholder="HH:MM:SS"
                    >
                    <div class="add-time-to-count-down" id="addTimeToCountdown">
                        <button class="add-time-btn" data-type="second" data-value="10">+10s</button>
                        <button class="add-time-btn" data-type="second" data-value="20">+20s</button>
                        <button class="add-time-btn" data-type="second" data-value="30">+30s</button>
                        <button class="add-time-btn" data-type="minute" data-value="1">+1m</button>
                        <button class="add-time-btn" data-type="hour" data-value="1">+1h</button>
                    </div>
                </div>    
            </div>
            <div class="controls">
                <button
                    id="timerSettingsBtn"
                    class="timer-settings-button"
                    title="Timer settings"
                >
                    ⏱
                </button>
                <button 
                    id="startBtn"
                    class="timer-action-button"
                    title="Start"
                    aria-label="Start"
                >
                    ▶
                </button>
                <button 
                    id="resetBtn"
                    class="timer-action-button"
                    title="Reset"
                    aria-label="Reset"
                >
                    ↻
                </button>
            </div>
        </div>
        <script src="./renderer.js"></script>
    </body>
</html>
